expose_php = Off
memory_limit = 256M
max_execution_time = 120

; Candidate documents are validated at 10 MB (resume at 5 MB); post_max_size
; must exceed upload_max_filesize. Keep in step with client_max_body_size in
; docker/nginx.conf.
upload_max_filesize = 10M
post_max_size = 12M

display_errors = Off
log_errors = On
error_log = /dev/stderr

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
; Code never changes inside a running container, so skip the stat() calls.
opcache.validate_timestamps = 0
