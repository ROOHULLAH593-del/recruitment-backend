; Named zzz-* so it is loaded after the base image's www.conf and
; zz-docker.conf (which sets `listen = 9000` on all interfaces) and wins.

[www]
; Only nginx in this same container talks to PHP-FPM.
listen = 127.0.0.1:9000

; Without this PHP-FPM wipes the environment, so the variables set in
; Render's dashboard (APP_KEY, DB_*, MAIL_*, ...) would never reach Laravel.
clear_env = no

; Surface PHP errors/warnings in Render's log stream.
catch_workers_output = yes
decorate_workers_output = no

; Sized for Render's smaller instances (~40 MB per Laravel worker).
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
