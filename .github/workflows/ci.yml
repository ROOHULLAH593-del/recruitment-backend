name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Pint + PHPUnit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, ctype, json, bcmath, pdo, pdo_sqlite, sqlite3, curl, dom, fileinfo, openssl, tokenizer, gd, zip
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Generate a throwaway JaaS signing key
        # Interview API responses sign a video-call JWT locally (no network
        # call) with the PEM at JAAS_PRIVATE_KEY_PATH. That file holds a real
        # credential, so it's gitignored and absent on a fresh checkout —
        # without it, every test that serializes an Interview 500s. Any
        # syntactically valid RSA key satisfies JWT::encode() here; nothing
        # verifies it against the real JaaS service in tests.
        run: openssl genrsa -out storage/app/private/jaas-private-key.pem 2048

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Run PHPUnit
        run: php artisan test --compact
