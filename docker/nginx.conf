# Rendered to /etc/nginx/nginx.conf by docker/entrypoint.sh, which substitutes
# __PORT__ with the port Render tells the container to listen on ($PORT).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    keepalive_timeout 65;

    # Candidate document uploads are validated at 10 MB; leave headroom for
    # multipart overhead. Keep in step with docker/php.ini (post_max_size).
    client_max_body_size 12m;

    server {
        listen __PORT__ default_server;
        server_name _;

        root /var/www/html/public;
        index index.php;
        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_hide_header X-Powered-By;

            # The resume upload calls Gemini synchronously, which can be slow.
            fastcgi_read_timeout 120s;
        }

        # Never serve dotfiles (.env, .git, ...) even though they are kept
        # out of the image; .well-known stays reachable.
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
