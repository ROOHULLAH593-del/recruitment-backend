[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-worker]
; Notifications (ApplicationStatusChanged, OfferSent, InterviewScheduled) are
; queued rather than sent inline, so a slow/hanging mail server can never
; block the HTTP response a status change already succeeded at — nothing
; drains QUEUE_CONNECTION=database without this running. --max-time recycles
; the worker hourly (picks up a new deploy's code, bounds any memory growth);
; autorestart brings it straight back up, same as php-fpm/nginx above.
command=php artisan queue:work --tries=3 --backoff=10 --max-time=3600 --sleep=3
directory=/var/www/html
user=www-data
priority=30
autorestart=true
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
